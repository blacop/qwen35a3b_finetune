project:
  name: rag_mvp_typlay_baseline
  language: zh

ingest:
  source_dir: /video-storage/ai-customer/qwen35a3b_finetune/rag/typlay/text_all
  source_glob: "*.txt"
  source_format: extracted_text
  note: docx_and_pdf_pre_extracted_to_txt

chunk:
  chunk_size: 480
  overlap: 96
  min_chunk_chars: 20
  preserve_paragraphs: true
  dedupe_adjacent: false

index:
  output_dir: /video-storage/ai-customer/qwen35a3b_finetune/rag/typlay/rag_index_typlay_baseline_480_96
  ngram_min: 1
  ngram_max: 3
  dense_backend: svd
  dense_dim: 256

paths:
  corpus_dir: /video-storage/ai-customer/qwen35a3b_finetune/rag/typlay/text_all
  index_dir: /video-storage/ai-customer/qwen35a3b_finetune/rag/typlay/rag_index_typlay_baseline_480_96
  eval_dataset: /home/ubuntu/generate/tydata_rag/rag_mvp/data/eval/eval_questions.jsonl
  output_dir: /home/ubuntu/generate/tydata_rag/rag_mvp/outputs/typlay_baseline_480_96

retrieval:
  backend: local
  mode: hybrid
  fusion: rrf
  top_k: 5
  min_score: 0.01
  min_score_vec: 0.0
  candidate_k: 40
  rrf_k: 60
  weight_lex: 0.55
  weight_vec: 0.45
  enable_rerank: true

api:
  base_url: http://127.0.0.1:18080
  api_key: ""
  timeout_s: 30

evaluation:
  recall_k: [1, 3, 5]
  require_source_file_match: true
  require_evidence_contains: true
  output_prefix: typlay_baseline
  max_rows: 0
